# /etc/nginx/sites-available/dialogue-and-ai
#
# dialogue.example.com は自分のドメインに置き換える。
# 証明書は certbot --nginx で取る (ssl_certificate の行は certbot が書き換える)。

server {
	listen 80;
	listen [::]:80;
	server_name dialogue.example.com;

	# certbot が入れる転送と同じ。証明書を取る前は一時的にこのままでも動く
	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name dialogue.example.com;

	ssl_certificate /etc/letsencrypt/live/dialogue.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/dialogue.example.com/privkey.pem;

	# 添付は1ファイル10MBまで。既定の 1m のままだと 413 になる
	client_max_body_size 12m;

	# 部屋のURLをアクセスログに残さない。残すなら終わったあとに消すこと
	access_log off;

	location / {
		proxy_pass http://127.0.0.1:8787;
		proxy_http_version 1.1;

		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		# keep-alive を切る。SSE をチャンクのまま流すため
		proxy_set_header Connection '';

		# SSE はアプリが X-Accel-Buffering: no を返すので、nginx はそこだけバッファしない。
		# 静的ファイルはバッファさせたいので、ここでは off にしない
		proxy_cache off;

		# SSE の接続は開いたままになる。既定の60秒だと切られる
		proxy_read_timeout 1h;
		proxy_send_timeout 1h;
	}
}
