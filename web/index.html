<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>おしゃべりルーム</title>
    <meta name="description" content="子ども向け AI参加型グループチャット。URLひとつで入れる部屋に、AIが同席する。" />

    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />

    <!-- SNSに貼られたときのプレビュー。画像のURLは絶対パスでないと出ないので、
         ビルド時に SITE_URL を差し込む (vite.config.ts)。未設定なら相対パスのまま残る -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="おしゃべりルーム" />
    <meta property="og:title" content="おしゃべりルーム" />
    <meta property="og:description" content="子ども向け AI参加型グループチャット。URLひとつで入れる部屋に、AIが同席する。" />
    <meta property="og:image" content="%SITE_URL%/assets/ogp.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="おしゃべりルーム - 子ども向け AI参加型グループチャット" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
